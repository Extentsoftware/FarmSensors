<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="320" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="240" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Capacitive Soil Moisture Sensor Circuit</text>
  
  <!-- Power supply -->
  <text x="40" y="60" font-family="Arial" font-size="10">3.3V Supply</text>
  <line x1="20" y1="80" x2="60" y2="80" stroke="black" stroke-width="2"/>
  <line x1="40" y1="80" x2="40" y2="100" stroke="black" stroke-width="2"/>
  <text x="50" y="95" font-family="Arial" font-size="8">+</text>
  
  <!-- 74HC14 -->
  <rect x="100" y="70" width="40" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="120" y="90" text-anchor="middle" font-family="Arial" font-size="10">74HC14</text>
  
  <!-- Pin labels -->
  <text x="95" y="85" font-family="Arial" font-size="8">14</text>
  <text x="95" y="100" font-family="Arial" font-size="8">1</text>
  <text x="145" y="100" font-family="Arial" font-size="8">2</text>
  <text x="95" y="115" font-family="Arial" font-size="8">7</text>
  
  <!-- RC components -->
  <text x="180" y="90" font-family="Arial" font-size="8">R1</text>
  <rect x="160" y="95" width="20" height="10" fill="none" stroke="black"/>
  <text x="170" y="110" text-anchor="middle" font-family="Arial" font-size="7">10kΩ</text>
  
  <!-- Soil sensor -->
  <text x="240" y="90" font-family="Arial" font-size="8">Soil Sensor</text>
  <rect x="220" y="95" width="20" height="10" fill="none" stroke="black"/>
  <text x="230" y="110" text-anchor="middle" font-family="Arial" font-size="7">C1</text>
  
  <!-- ATTINY85 -->
  <rect x="300" y="70" width="40" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-family="Arial" font-size="10">ATTINY85</text>
  
  <!-- ATTINY85 pins -->
  <text x="295" y="85" font-family="Arial" font-size="8">1</text>
  <text x="295" y="100" font-family="Arial" font-size="8">2</text>
  <text x="295" y="110" font-family="Arial" font-size="8">3</text>
  <text x="295" y="120" font-family="Arial" font-size="8">4</text>
  <text x="345" y="85" font-family="Arial" font-size="8">8</text>
  
  <!-- CubeCell -->
  <rect x="380" y="70" width="40" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-family="Arial" font-size="10">CubeCell</text>
  
  <!-- CubeCell pins -->
  <text x="375" y="85" font-family="Arial" font-size="8">VCC</text>
  <text x="375" y="115" font-family="Arial" font-size="8">GND</text>
  <text x="425" y="100" font-family="Arial" font-size="8">Data</text>
  
  <!-- Ground -->
  <text x="40" y="140" font-family="Arial" font-size="10">GND</text>
  <line x1="20" y1="160" x2="60" y2="160" stroke="black" stroke-width="2"/>
  <line x1="40" y1="160" x2="40" y2="180" stroke="black" stroke-width="2"/>
  <text x="50" y="175" font-family="Arial" font-size="8">⊥</text>
  
  <!-- Power connections -->
  <line x1="40" y1="100" x2="100" y2="100" stroke="red" stroke-width="2"/>
  <line x1="40" y1="100" x2="40" y2="110" stroke="red" stroke-width="2"/>
  <line x1="40" y2="110" x2="100" y2="110" stroke="red" stroke-width="2"/>
  <line x1="100" y2="110" x2="100" y2="100" stroke="red" stroke-width="2"/>
  
  <line x1="40" y1="100" x2="300" y2="100" stroke="red" stroke-width="2"/>
  <line x1="300" y1="100" x2="300" y2="110" stroke="red" stroke-width="2"/>
  <line x1="300" y2="110" x2="340" y2="110" stroke="red" stroke-width="2"/>
  <line x1="340" y2="110" x2="340" y2="100" stroke="red" stroke-width="2"/>
  
  <line x1="40" y1="100" x2="380" y2="100" stroke="red" stroke-width="2"/>
  <line x1="380" y1="100" x2="380" y2="110" stroke="red" stroke-width="2"/>
  <line x1="380" y2="110" x2="420" y2="110" stroke="red" stroke-width="2"/>
  <line x1="420" y2="110" x2="420" y2="100" stroke="red" stroke-width="2"/>
  
  <!-- Ground connections -->
  <line x1="40" y1="180" x2="100" y2="180" stroke="black" stroke-width="2"/>
  <line x1="100" y1="180" x2="100" y2="110" stroke="black" stroke-width="2"/>
  <line x1="40" y1="180" x2="300" y2="180" stroke="black" stroke-width="2"/>
  <line x1="300" y1="180" x2="300" y2="110" stroke="black" stroke-width="2"/>
  <line x1="40" y1="180" x2="380" y2="180" stroke="black" stroke-width="2"/>
  <line x1="380" y1="180" x2="380" y2="110" stroke="black" stroke-width="2"/>
  
  <!-- 1-wire connection -->
  <line x1="340" y1="100" x2="380" y2="100" stroke="blue" stroke-width="2"/>
  <text x="360" y="95" text-anchor="middle" font-family="Arial" font-size="8">1-wire</text>
  
  <!-- Frequency input -->
  <line x1="140" y1="100" x2="300" y2="100" stroke="green" stroke-width="2"/>
  <text x="220" y="95" text-anchor="middle" font-family="Arial" font-size="8">freq</text>
  
  <!-- RC oscillator connections -->
  <line x1="140" y1="100" x2="160" y2="100" stroke="black" stroke-width="2"/>
  <line x1="180" y1="100" x2="220" y2="100" stroke="black" stroke-width="2"/>
  <line x1="240" y1="100" x2="260" y2="100" stroke="black" stroke-width="2"/>
  <line x1="260" y1="100" x2="260" y2="180" stroke="black" stroke-width="2"/>
  <line x1="260" y1="180" x2="40" y2="180" stroke="black" stroke-width="2"/>
  
  <!-- Decoupling capacitor -->
  <text x="60" y="110" font-family="Arial" font-size="7">100nF</text>
  <rect x="48" y="105" width="12" height="8" fill="none" stroke="black"/>
  
  <!-- Legend -->
  <text x="20" y="220" font-family="Arial" font-size="10" font-weight="bold">Legend:</text>
  <line x1="20" y1="240" x2="30" y2="240" stroke="red" stroke-width="2"/>
  <text x="35" y="245" font-family="Arial" font-size="8">Power (3.3V)</text>
  <line x1="20" y1="255" x2="30" y2="255" stroke="black" stroke-width="2"/>
  <text x="35" y="260" font-family="Arial" font-size="8">Ground</text>
  <line x1="20" y1="270" x2="30" y2="270" stroke="blue" stroke-width="2"/>
  <text x="35" y="275" font-family="Arial" font-size="8">1-wire Data</text>
  <line x1="20" y1="285" x2="30" y2="285" stroke="green" stroke-width="2"/>
  <text x="35" y="290" font-family="Arial" font-size="8">Frequency Signal</text>
</svg>
