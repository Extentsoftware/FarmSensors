<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="480" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Interdigitated Soil Moisture Sensor Design</text>
  
  <!-- Primary Soil Sensor Area -->
  <text x="160" y="60" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Primary Soil Sensor (with soldermask)</text>
  <text x="160" y="75" text-anchor="middle" font-family="Arial" font-size="10">25mm x 15mm</text>
  
  <!-- Draw primary sensor area -->
  <rect x="40" y="100" width="240" height="60" fill="lightgray" stroke="black" stroke-width="2"/>
  
  <!-- Draw interdigitated electrodes -->
  <!-- Electrode A (red) -->
  <g stroke="red" stroke-width="2">
    <line x1="48" y1="110" x2="48" y2="150"/>
    <line x1="56" y1="110" x2="56" y2="150"/>
    <line x1="64" y1="110" x2="64" y2="150"/>
    <line x1="72" y1="110" x2="72" y2="150"/>
    <line x1="80" y1="110" x2="80" y2="150"/>
    <line x1="88" y1="110" x2="88" y2="150"/>
    <line x1="96" y1="110" x2="96" y2="150"/>
    <line x1="104" y1="110" x2="104" y2="150"/>
    <line x1="112" y1="110" x2="112" y2="150"/>
    <line x1="120" y1="110" x2="120" y2="150"/>
    <line x1="128" y1="110" x2="128" y2="150"/>
    <line x1="136" y1="110" x2="136" y2="150"/>
  </g>
  
  <!-- Electrode B (blue) -->
  <g stroke="blue" stroke-width="2">
    <line x1="52" y1="110" x2="52" y2="150"/>
    <line x1="60" y1="110" x2="60" y2="150"/>
    <line x1="68" y1="110" x2="68" y2="150"/>
    <line x1="76" y1="110" x2="76" y2="150"/>
    <line x1="84" y1="110" x2="84" y2="150"/>
    <line x1="92" y1="110" x2="92" y2="150"/>
    <line x1="100" y1="110" x2="100" y2="150"/>
    <line x1="108" y1="110" x2="108" y2="150"/>
    <line x1="116" y1="110" x2="116" y2="150"/>
    <line x1="124" y1="110" x2="124" y2="150"/>
    <line x1="132" y1="110" x2="132" y2="150"/>
    <line x1="140" y1="110" x2="140" y2="150"/>
  </g>
  
  <!-- Guard ring around primary sensor -->
  <rect x="20" y="80" x2="260" y2="180" fill="none" stroke="orange" stroke-width="4"/>
  <text x="140" y="75" text-anchor="middle" font-family="Arial" font-size="8">Guard Ring</text>
  
  <!-- Air Reference Area -->
  <text x="480" y="60" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Air Reference (no soldermask)</text>
  <text x="480" y="75" text-anchor="middle" font-family="Arial" font-size="10">10mm x 10mm</text>
  
  <!-- Draw air reference area -->
  <rect x="360" y="100" width="80" height="40" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Draw air reference electrodes -->
  <!-- Reference Electrode A -->
  <g stroke="red" stroke-width="2">
    <line x1="365" y1="105" x2="365" y2="135"/>
    <line x1="370" y1="105" x2="370" y2="135"/>
    <line x1="375" y1="105" x2="375" y2="135"/>
    <line x1="380" y1="105" x2="380" y2="135"/>
    <line x1="385" y1="105" x2="385" y2="135"/>
    <line x1="390" y1="105" x2="390" y2="135"/>
    <line x1="395" y1="105" x2="395" y2="135"/>
    <line x1="400" y1="105" x2="400" y2="135"/>
  </g>
  
  <!-- Reference Electrode B -->
  <g stroke="blue" stroke-width="2">
    <line x1="367" y1="105" x2="367" y2="135"/>
    <line x1="372" y1="105" x2="372" y2="135"/>
    <line x1="377" y1="105" x2="377" y2="135"/>
    <line x1="382" y1="105" x2="382" y2="135"/>
    <line x1="387" y1="105" x2="387" y2="135"/>
    <line x1="392" y1="105" x2="392" y2="135"/>
    <line x1="397" y1="105" x2="397" y2="135"/>
    <line x1="402" y1="105" x2="402" y2="135"/>
  </g>
  
  <!-- Guard ring around air reference -->
  <rect x="340" y="80" x2="460" y2="160" fill="none" stroke="orange" stroke-width="4"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial" font-size="8">Guard Ring</text>
  
  <!-- Cross-section view -->
  <text x="320" y="220" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Cross-Section View</text>
  
  <!-- PCB layers -->
  <line x1="80" y1="250" x2="560" y2="250" stroke="black" stroke-width="2"/>
  <line x1="80" y1="260" x2="560" y2="260" stroke="gray" stroke-width="2"/>
  <line x1="80" y1="270" x2="560" y2="270" stroke="black" stroke-width="2"/>
  <line x1="80" y1="280" x2="560" y2="280" stroke="gray" stroke-width="2"/>
  
  <!-- Labels for layers -->
  <text x="570" y="255" font-family="Arial" font-size="8">Top Copper (Electrodes)</text>
  <text x="570" y="265" font-family="Arial" font-size="8">Soldermask (Green)</text>
  <text x="570" y="275" font-family="Arial" font-size="8">Bottom Copper (Ground)</text>
  <text x="570" y="285" font-family="Arial" font-size="8">Soldermask (Green)</text>
  
  <!-- Primary sensor cross-section -->
  <line x1="120" y1="250" x2="280" y2="250" stroke="red" stroke-width="3"/>
  <line x1="130" y1="250" x2="270" y2="250" stroke="blue" stroke-width="3"/>
  <line x1="120" y1="260" x2="280" y2="260" stroke="gray" stroke-width="2"/>
  <text x="200" y="290" text-anchor="middle" font-family="Arial" font-size="8">Primary Sensor</text>
  
  <!-- Air reference cross-section -->
  <line x1="360" y1="250" x2="440" y2="250" stroke="red" stroke-width="3"/>
  <line x1="365" y1="250" x2="435" y2="250" stroke="blue" stroke-width="3"/>
  <text x="400" y="290" text-anchor="middle" font-family="Arial" font-size="8">Air Reference</text>
  
  <!-- Electrical connections -->
  <text x="320" y="320" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Electrical Connections</text>
  
  <!-- Connection diagram -->
  <line x1="40" y1="340" x2="120" y2="340" stroke="red" stroke-width="2"/>
  <text x="130" y="345" font-family="Arial" font-size="8">Electrode A → 74HC14 Pin 1</text>
  
  <line x1="40" y1="355" x2="120" y2="355" stroke="blue" stroke-width="2"/>
  <text x="130" y="360" font-family="Arial" font-size="8">Electrode B → 74HC14 Pin 2</text>
  
  <line x1="40" y1="370" x2="120" y2="370" stroke="orange" stroke-width="2"/>
  <text x="130" y="375" font-family="Arial" font-size="8">Guard Ring → 74HC14 Pin 2</text>
  
  <line x1="40" y1="385" x2="120" y2="385" stroke="green" stroke-width="2"/>
  <text x="130" y="390" font-family="Arial" font-size="8">Ground Plane → GND</text>
  
  <!-- Specifications -->
  <text x="320" y="420" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold">Specifications:</text>
  <text x="40" y="440" font-family="Arial" font-size="8">• Finger width: 0.5mm</text>
  <text x="40" y="455" font-family="Arial" font-size="8">• Finger spacing: 0.5mm</text>
  <text x="40" y="470" font-family="Arial" font-size="8">• Primary sensor: 12 fingers x 10mm</text>
  
  <text x="320" y="440" font-family="Arial" font-size="8">• Air reference: 8 fingers x 5mm</text>
  <text x="320" y="455" font-family="Arial" font-size="8">• Guard ring: 2mm wide</text>
  <text x="320" y="470" font-family="Arial" font-size="8">• Soldermask: Applied over primary sensor only</text>
</svg>
